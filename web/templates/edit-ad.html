<!doctype html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Редактировать объявление — Obyavigo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/styles/style.css" />
        <link rel="stylesheet" href="/static/styles/create-ad.css" />
        <link rel="icon" type="image/png" href="/static/pictures/logo.png" />
    </head>
    <body>
        <header class="header" id="header" role="banner">
            <div class="header-container">
                <a
                    href="/"
                    class="header-logo-container"
                    aria-label="Obyavigo - главная страница"
                >
                    <img
                        src="/static/pictures/logo.png"
                        alt="Obyavigo"
                        class="header-logo"
                    />
                </a>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <div class="create-ad-container">
                    <h1 class="page-title">Редактировать объявление</h1>

                    <form id="editAdForm" class="create-ad-form" data-ad-id="{{.AdID}}">
                        <div class="form-step active">
                            <h2>Основные данные</h2>

                            <div class="form-row">
                                <div class="form-group half">
                                    <label>Заголовок <span class="required">*</span></label>
                                    <input
                                        type="text"
                                        id="adTitle"
                                        placeholder=""
                                        maxlength="100"
                                        value=""
                                    />
                                    <div class="error-message" id="titleError"></div>
                                </div>
                                <div class="form-group half">
                                    <label>Цена (в BYN) <span class="required">*</span></label>
                                    <input
                                        type="number"
                                        id="adPrice"
                                        placeholder="0"
                                        min="0"
                                        value=""
                                    />
                                    <div class="error-message" id="priceError"></div>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group half">
                                    <label>Состояние <span class="required">*</span></label>
                                    <select id="adCondition">
                                        <option value="">Выберите состояние</option>
                                        <option value="new">Новое</option>
                                        <option value="used">Б/У</option>
                                    </select>
                                    <div class="error-message" id="conditionError"></div>
                                </div>
                                <div class="form-group half">
                                    <label>Контактный телефон</label>
                                    <input
                                        type="tel"
                                        id="adPhone"
                                        placeholder="+375 (29) 123-45-67"
                                        value=""
                                    />
                                    <div class="error-message" id="phoneError"></div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Описание <span class="required">*</span></label>
                                <textarea
                                    id="adDescription"
                                    placeholder="Расскажите подробнее: состояние, комплектация, причина продажи..."
                                    rows="6"
                                    maxlength="2000"
                                ></textarea>
                                <div class="error-message" id="descriptionError"></div>
                            </div>

                            <div class="form-actions" style="display: flex; gap: 15px; margin-top: 30px;">
                                <button
                                    type="button"
                                    class="btn-secondary"
                                    onclick="window.location.href='/profile/'"
                                    style="flex: 1;"
                                >
                                    Отмена
                                </button>
                                <button
                                    type="submit"
                                    class="btn-primary submit-btn"
                                    style="flex: 2;"
                                >
                                    Сохранить изменения
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <script src="/static/scripts/header.js"></script>
        <script src="/static/scripts/edit-ad.js"></script>
    </body>
</html>
