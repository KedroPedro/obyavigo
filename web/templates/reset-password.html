<!doctype html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Восстановление пароля на Obyavigo"
        />
        <meta name="robots" content="noindex, nofollow" />
        <title>Восстановление пароля — Obyavigo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/styles/style.css" />
        <link rel="stylesheet" href="/static/styles/auth.css" />
        <link rel="icon" type="image/png" href="/static/pictures/logo.png" />
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <img
                        src="/static/pictures/logo.png"
                        alt="Obyavigo"
                        width="50"
                        height="50"
                    />
                </div>

                <h2 class="reset-password-title">Новый пароль</h2>

                <form
                    id="resetPasswordForm"
                    class="auth-form active"
                    novalidate
                >
                    <p class="form-info">
                        Введите новый пароль для вашей учетной записи.
                    </p>
                    <div class="form-group">
                        <label for="newPassword" class="sr-only"
                            >Новый пароль</label
                        >
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Новый пароль"
                            required
                            autocomplete="new-password"
                            aria-describedby="newPasswordError"
                        />
                        <div
                            class="error-message"
                            id="newPasswordError"
                            role="alert"
                            aria-live="polite"
                        ></div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="sr-only"
                            >Повторите пароль</label
                        >
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Повторите пароль"
                            required
                            autocomplete="new-password"
                            aria-describedby="confirmPasswordError"
                        />
                        <div
                            class="error-message"
                            id="confirmPasswordError"
                            role="alert"
                            aria-live="polite"
                        ></div>
                    </div>
                    <button type="submit" class="auth-submit-btn">
                        Сбросить пароль
                    </button>
                    <a href="/auth/" class="auth-back-btn">
                        ← Вернуться ко входу
                    </a>
                </form>

                <div class="auth-footer">
                    <p>Ссылка действительна в течение 1 часа</p>
                </div>
            </div>

            <button
                id="themeToggleBtn"
                class="theme-toggle-btn"
                aria-label="Переключить тему"
            >
                <span class="theme-icon" aria-hidden="true">🌙</span>
            </button>
        </div>

        <script src="/static/scripts/reset-password.js"></script>
    </body>
</html>
